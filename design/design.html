    <style>
      .image-list-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
      }

      .image-list-subcontainer {
        width: 100%;
        max-width: 1280px;
        margin: 20px 0;
      }

      .image-item {
        position: relative;
        cursor: pointer;
        margin-bottom: 3em;
      }

      .image-item > img {
        width: 100%;
        aspect-ratio: 3 / 1;
        object-fit: cover;
        opacity: 0.5;
        transition: opacity 0.3s;
      }

      .image-item:hover > img {
        opacity: 0.1;
      }

      .image-item:onclick img {
        opacity: 0.8;
      }

      .image-text {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: black;
        font-size: 30px;
        font-weight: bold;
        text-align: center;
        pointer-events: none;
      }

      /* Popup modal (project-style) */
      .design_popup {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(6px);
        justify-content: center;
        align-items: center;
      }

      .design_popup .popup_content {
        background: #ffffff;
        padding: 10px;
        width: 70%;
        max-width: 1200px;
        max-height: 90vh;
        overflow: auto;
        position: relative;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .design_popup .close-button {
        border: none;
        background-color: transparent;
        color: black;
        font-size: 1.5rem;
        width: 30px;
        height: 30px;
        position: absolute;
        top: 10px;
        right: 10px;
        cursor: pointer;
        transition: background-color 0.3s ease;
      }

      .design_popup .close-button:hover {
        background-color: #c9c9c9;
      }

      .design_popup .popup_text {
        width: 87%;
        padding: 10px;
        flex-shrink: 0;
        text-align: left;
        margin-bottom: 1em;
      }

      .design_popup .popup_title {
        margin-top: 1.5em;
        font-size: 1.4em;
        font-weight: 600;
        margin-bottom: 0.8em;
      }

      .design_popup .popup_description {
        font-size: 1em;
        line-height: 1.25;
        margin: 0;
        font-weight: 200;
        margin-bottom: 0.8em;
      }

      .design_popup .gallery-container {
        width: 90%;
        margin: 1em 0;
      }

      .design_popup .image-container {
        width: 100%;
      }

      .design_popup .gallery-slide {
        width: 100%;
        height: auto;
        object-fit: contain;
      }

      @media (max-width: 768px) {
        /* No hover dimming on touch — tapping goes straight to popup */
        .image-item > img {
          opacity: 0.55;
        }

        .image-item:hover > img {
          opacity: 0.55;
        }

        .image-text {
          font-size: 20px;
        }

        .design_popup .popup_content {
          width: 94%;
          max-height: 88vh;
        }
      }

      </style>

    <script>
      const images = document.querySelectorAll(".clickable-image");
      const modals = document.querySelectorAll(".design_popup");

      images.forEach((image) => {
        image.addEventListener("click", () => {
          const modalId = image.getAttribute("data-modal");
          const modal = document.getElementById(modalId);
          modal.style.display = "flex";
        });
      });

      modals.forEach((modal) => {
        const closeButton = modal.querySelector(".close-button");
        closeButton.addEventListener("click", () => {
          modal.style.display = "none";
        });
      });

      window.addEventListener("click", (event) => {
        modals.forEach((modal) => {
          if (event.target === modal) {
            modal.style.display = "none";
          }
        });
      });
    </script>
