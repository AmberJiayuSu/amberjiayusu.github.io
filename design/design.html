    <style>
      .image-list-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
      }

      .image-list-subcontainer {
        width: 100%;
        max-width: 1280px;
        margin: 20px 0;
      }

      .page_block .image-item {
        position: relative;
        display: block;
        cursor: pointer;
        margin-bottom: 3em;
        text-decoration: none;
        color: inherit;
        background-color: transparent;
      }

      .page_block .image-item:hover {
        color: inherit;
        background-color: transparent;
        text-decoration: none;
      }

      .page_block .image-item > img {
        width: 100%;
        aspect-ratio: 3 / 1;
        object-fit: cover;
        opacity: 0.5;
        transition: opacity 0.3s;
      }

      .page_block .image-item:hover > img {
        opacity: 0.1;
      }

      .image-text {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: black;
        font-size: 30px;
        font-weight: bold;
        text-align: center;
        pointer-events: none;
      }

      @media (max-width: 768px) {
        /* No hover dimming on touch — tapping goes straight through */
        .page_block .image-item > img {
          opacity: 0.55;
        }

        .page_block .image-item:hover > img {
          opacity: 0.55;
        }

        .image-text {
          font-size: 20px;
        }
      }

      </style>
